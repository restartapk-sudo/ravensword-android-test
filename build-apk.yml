name: Ravensword test APK for POCO F8 Pro
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify uploaded Ravensword project
        shell: bash
        run: |
          set -Eeuo pipefail
          for n in 01 02 03; do test -s "ravensword_project.part${n}"; done
          cat ravensword_project.part01 ravensword_project.part02 ravensword_project.part03 > "$RUNNER_TEMP/ravensword-project.zip"
          [[ "$(sha256sum "$RUNNER_TEMP/ravensword-project.zip" | cut -d ' ' -f1)" == "983a55a36934c9700acea4d087aa34bb99695a2051a811029ba6d04a1818287e" ]] || { echo 'Project chunks are incomplete/modified'; exit 1; }
          unzip -t "$RUNNER_TEMP/ravensword-project.zip" >/dev/null
          unzip -oq "$RUNNER_TEMP/ravensword-project.zip" -d .
          test -s project.godot
          test -s export_presets.cfg
          test -f assets/level21_geometry_preview.glb
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - name: Install required Android SDK packages
        run: |
          test -n "${ANDROID_SDK_ROOT:-}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35' 'cmdline-tools;latest' 'cmake;3.10.2.4988404' 'ndk;28.1.13356709'
      - name: Install Godot 4.6 and matching templates
        run: |
          set -euo pipefail
          base='https://github.com/godotengine/godot-builds/releases/download/4.6-stable'
          curl -fL --retry 3 -o /tmp/godot.zip "$base/Godot_v4.6-stable_linux.x86_64.zip"
          unzip -t /tmp/godot.zip >/dev/null
          mkdir -p /tmp/godot
          unzip -jo /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v4.6-stable_linux.x86_64" >> "$GITHUB_ENV"
          curl -fL --retry 3 -o /tmp/templates.tpz "$base/Godot_v4.6-stable_export_templates.tpz"
          unzip -t /tmp/templates.tpz >/dev/null
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          unzip -jo /tmp/templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/android_source.zip' -d "$HOME/.local/share/godot/export_templates/4.6.stable"
          test -s "$HOME/.local/share/godot/export_templates/4.6.stable/android_debug.apk"
          echo "4.6.stable" > "$HOME/.local/share/godot/export_templates/4.6.stable/version.txt"
      - name: Create temporary Android debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"
      - name: Validate original recovered GLB assets
        run: |
          python3 -m pip install pillow numpy trimesh
          python3 validate_project.py
          python3 test_verify_android_apk.py
          python3 test_verify_android_page_size.py
          python3 test_verify_android_device_target.py
          python3 validate_assets.py
          python3 validate_spawn_hints.py
          python3 validate_walkable_spawn.py
      - name: Initialize Godot and configure Android SDK paths
        run: |
          "$GODOT_BIN" --headless --path . --editor --quit
          python3 configure_godot_android.py
      - name: Import GLB and export APK
        run: bash ./export_android.sh
      - name: Check Godot successfully loaded all reconstructed scenes
        run: |
          python3 verify_godot_smoke_report.py build/godot_scene_smoke.json
      - name: Check main scene, controls and experimental walker in Godot
        run: python3 verify_godot_app_runtime.py build/godot_app_runtime_smoke.json
      - name: Report APK checks for ARM64 and Android 16 (16 KiB)
        run: |
          cat build/apk_16k_report.json
          cat build/android_target_report.json
          cat build/zipalign_16k.log
          cat build/apksigner.log
      - name: Upload test APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ravensword-arm64-prototype
          path: |
            build/*.apk
            build/*.log
            build/*.json
            build/zipalign_16k.log
            build/apksigner.log
          if-no-files-found: warn
