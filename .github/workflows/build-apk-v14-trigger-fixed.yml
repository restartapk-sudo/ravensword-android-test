name: Ravensword APK v14 - trigger fixed
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  export-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify uploaded Ravensword project
        shell: bash
        run: |
          set -Eeuo pipefail
          for n in 01 02 03 04; do test -s "ravensword_v11_project.part${n}"; done
          cat ravensword_v11_project.part01 ravensword_v11_project.part02 ravensword_v11_project.part03 ravensword_v11_project.part04 > "$RUNNER_TEMP/ravensword-project.zip"
          [[ "$(sha256sum "$RUNNER_TEMP/ravensword-project.zip" | cut -d ' ' -f1)" == "4e324756cbd95c5b673720b9133cb7f417e08e07dd0dd5831c3eb7522954339a" ]] || { echo 'Project chunks are incomplete/modified'; exit 1; }
          unzip -t "$RUNNER_TEMP/ravensword-project.zip" >/dev/null
          unzip -oq "$RUNNER_TEMP/ravensword-project.zip" -d .
          test -s project.godot
          test -s export_presets.cfg
          test -f assets/level21_geometry_preview.glb
      - name: Quick project check before installing toolchains
        run: |
          python3 validate_project.py
          python3 test_verify_android_apk.py
          python3 test_verify_android_page_size.py
          python3 test_verify_android_device_target.py
          python3 test_runtime_diagnostics_static.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # GitHub-hosted ubuntu-24.04 runners already include the Android SDK.
      # Avoid android-actions/setup-android@v3: sdkmanager inside that action
      # fails on some runner images before Godot can be installed.
      - name: Verify preinstalled Android SDK on GitHub runner
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK" ]]; then
            echo '::error::ANDROID_SDK_ROOT and ANDROID_HOME are not set'
            exit 1
          fi
          echo "Android SDK: $SDK"
          for file in \
              platform-tools/adb \
              build-tools/35.0.1/aapt \
              build-tools/35.0.1/zipalign \
              build-tools/35.0.1/apksigner \
              platforms/android-35/android.jar; do
            if [[ ! -s "$SDK/$file" ]]; then
              echo "::error::Missing required Android SDK component: $SDK/$file"
              exit 1
            fi
          done
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo 'Preinstalled Android SDK components verified.'
      - name: Install Godot 4.6 and matching templates
        run: |
          set -euo pipefail
          base='https://github.com/godotengine/godot-builds/releases/download/4.6-stable'
          curl -fL --retry 3 -o /tmp/godot.zip "$base/Godot_v4.6-stable_linux.x86_64.zip"
          unzip -t /tmp/godot.zip >/dev/null
          mkdir -p /tmp/godot
          unzip -jo /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v4.6-stable_linux.x86_64" >> "$GITHUB_ENV"
          curl -fL --retry 3 -o /tmp/templates.tpz "$base/Godot_v4.6-stable_export_templates.tpz"
          unzip -t /tmp/templates.tpz >/dev/null
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          unzip -jo /tmp/templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/android_source.zip' -d "$HOME/.local/share/godot/export_templates/4.6.stable"
          test -s "$HOME/.local/share/godot/export_templates/4.6.stable/android_debug.apk"
          echo "4.6.stable" > "$HOME/.local/share/godot/export_templates/4.6.stable/version.txt"
      - name: Create temporary Android debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"
      - name: Validate original recovered GLB assets
        run: |
          python3 -m pip install pillow numpy trimesh
          python3 validate_project.py
          python3 test_verify_android_apk.py
          python3 test_verify_android_page_size.py
          python3 test_verify_android_device_target.py
          python3 validate_assets.py
          python3 validate_spawn_hints.py
          python3 validate_walkable_spawn.py
      - name: Fix character normals and backface culling (v12)
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/ravensword_v12_patch_glb.py <<'PYTHON'
          #!/usr/bin/env python3
          """Diagnostic repair of glTF mesh normals and humanoid backface culling.
          
          Does not reconstruct missing geometry, animations, or original game logic.
          Requires numpy. Can be run inside an extracted Ravensword v11 Godot project.
          """
          from __future__ import annotations
          import hashlib, json, re, struct, sys
          from pathlib import Path
          import numpy as np
          
          HUMANOID = re.compile(r'(?:women|woman|girl|king|queen|princess|hero|lucius|npc)', re.I)
          GLB_HEADER = struct.Struct('<4sII')
          CHUNK_HEADER = struct.Struct('<I4s')
          
          
          def read_glb(blob):
              if len(blob) < 28 or GLB_HEADER.unpack_from(blob)[0] != b'glTF':
                  raise ValueError('Not GLB')
              _, ver, total = GLB_HEADER.unpack_from(blob)
              if ver != 2 or total != len(blob):
                  raise ValueError('Invalid GLB version/length')
              cursor = 12
              chunks = []
              while cursor < len(blob):
                  n, kind = CHUNK_HEADER.unpack_from(blob, cursor)
                  cursor += 8
                  chunks.append((kind, blob[cursor:cursor+n]))
                  cursor += n
              if cursor != len(blob) or len(chunks) != 2 or chunks[0][0] != b'JSON' or chunks[1][0] != b'BIN\0':
                  raise ValueError('Expected JSON and BIN chunks')
              return json.loads(chunks[0][1]), bytearray(chunks[1][1])
          
          
          def read_acc(j, binary, index):
              acc = j['accessors'][index]
              view = j['bufferViews'][acc['bufferView']]
              types = {5121:np.dtype('u1'), 5123:np.dtype('<u2'), 5125:np.dtype('<u4'), 5126:np.dtype('<f4')}
              dtype = types[acc['componentType']]
              dimensions = {'SCALAR':1,'VEC2':2,'VEC3':3,'VEC4':4}[acc['type']]
              size = dimensions*dtype.itemsize
              stride = view.get('byteStride',size)
              offset = view.get('byteOffset',0)+acc.get('byteOffset',0)
              if stride == size:
                  arr = np.frombuffer(binary, dtype=dtype, count=acc['count']*dimensions,offset=offset)
                  return arr.reshape((acc['count'],dimensions)).copy()
              if offset + (acc['count']-1)*stride+size > len(binary):
                  raise ValueError('Out-of-bounds accessor')
              arr = np.ndarray((acc['count'],dimensions), dtype=dtype, buffer=binary,offset=offset,strides=(stride,dtype.itemsize))
              return arr.copy()
          
          
          def patch_glb(blob):
              j, binary = read_glb(blob)
              original_triangle_count = 0
              new_normals = 0
              humanoid_materials=set()
              for mesh in j.get('meshes',[]):
                  is_character = bool(HUMANOID.search(mesh.get('name','')))
                  for prim in mesh.get('primitives',[]):
                      if prim.get('mode',4) != 4:
                          continue
                      pos = read_acc(j,binary,prim['attributes']['POSITION']).astype(np.float64)
                      if 'indices' not in prim:
                          idx = np.arange(len(pos),dtype=np.int32)
                      else:
                          idx = read_acc(j,binary,prim['indices']).reshape(-1).astype(np.int64)
                      if len(idx)%3: raise ValueError('Indices not divisible by 3')
                      if len(idx) and (idx.max() >= len(pos) or idx.min() < 0):
                          raise ValueError('Out-of-bounds triangle index')
                      tris=idx.reshape(-1,3)
                      original_triangle_count += len(tris)
                      if is_character and 'NORMAL' not in prim['attributes']:
                          normals=np.zeros_like(pos,dtype=np.float64)
                          p0,p1,p2=pos[tris[:,0]],pos[tris[:,1]],pos[tris[:,2]]
                          face_normals=np.cross(p1-p0,p2-p0)
                          for corner in range(3):
                              np.add.at(normals,tris[:,corner],face_normals)
                          lengths=np.linalg.norm(normals,axis=1)
                          valid = lengths>1e-12
                          normals[valid]/=lengths[valid,None]
                          normals[~valid]=[0,0,1]
                          if not np.isfinite(normals).all():raise ValueError('Non-finite normal')
                          while len(binary)%4:binary.append(0)
                          start=len(binary)
                          binary.extend(normals.astype('<f4').tobytes())
                          vid=len(j['bufferViews'])
                          j['bufferViews'].append({'buffer':0,'byteOffset':start,'byteLength':len(normals)*12,'target':34962})
                          aid=len(j['accessors'])
                          j['accessors'].append({'bufferView':vid,'componentType':5126,'count':len(normals),'type':'VEC3'})
                          prim['attributes']['NORMAL']=aid
                          new_normals += 1
                      if is_character and 'material' in prim:
                          humanoid_materials.add(prim['material'])
              for imat in humanoid_materials:
                  j['materials'][imat]['doubleSided']=True
              j['buffers'][0]['byteLength']=len(binary)
              payload=json.dumps(j,ensure_ascii=False,separators=(',',':')).encode('utf8')
              payload+=b' ' *((-len(payload))%4)
              binary.extend(b'\0'*((-len(binary))%4))
              out=GLB_HEADER.pack(b'glTF',2,12+8+len(payload)+8+len(binary)) + CHUNK_HEADER.pack(len(payload),b'JSON')+payload+CHUNK_HEADER.pack(len(binary),b'BIN\0')+binary
              return bytes(out),{'normals_added_to_primitives':new_normals,'humanoid_double_sided_materials':len(humanoid_materials),'triangles':original_triangle_count}
          
          
          def patch_project(root):
              assets=root/'assets'
              catalog_path=root/'level_catalog.json';hints_path=root/'spawn_hints.json'
              catalog=json.loads(catalog_path.read_text(encoding='utf8'))
              hints=json.loads(hints_path.read_text(encoding='utf8'))
              result={}
              for row in catalog['stages']:
                  level=row['level']; path=assets/f'{level}_geometry_preview.glb'
                  old=path.read_bytes()
                  out,stat=patch_glb(old)
                  j,_=read_glb(out)
                  assert len(j['meshes'])==row['meshes']
                  assert sum(j['accessors'][p['indices']]['count']//3 for m in j['meshes'] for p in m['primitives'])==row['triangles']
                  _, out_binary=read_glb(out)
                  for m in j['meshes']:
                      for p in m['primitives']:
                          if 'NORMAL' in p['attributes']:
                              assert read_acc(j,out_binary,p['attributes']['NORMAL']).shape==(j['accessors'][p['attributes']['POSITION']]['count'],3)
                  assert len(j.get('images',[]))==row['images']
                  path.write_bytes(out)
                  sha=hashlib.sha256(out).hexdigest()
                  row['bytes']=len(out);row['sha256']=sha
                  hints['levels'][level]['source_sha256']=sha
                  result[level]={**stat,'bytes_before':len(old),'bytes_after':len(out)}
              catalog_path.write_text(json.dumps(catalog,ensure_ascii=False,indent=2),encoding='utf8')
              hints_path.write_text(json.dumps(hints,ensure_ascii=False,indent=2),encoding='utf8')
              # v12 should install alongside v11 for side-by-side visual comparisons.
              for name in ('export_presets.cfg','verify_android_device_target.py','test_verify_android_device_target.py'):
                  path=root/name
                  if path.exists():
                      text=path.read_text(encoding='utf8').replace('org.local.ravenswordwalkprototype.v11','org.local.ravenswordwalkprototype.v12')
                      if name=='export_presets.cfg':
                          text=text.replace('Ravensword ARM64 Test v11','Ravensword ARM64 Test v12').replace('version/code=4','version/code=5')
                      path.write_text(text,encoding='utf8')
              (root/'V12_FACE_DIAGNOSTIC_UA.md').write_text(
                  '# Ravensword v12: перевірка облич і нормалей\n\n'
                  'Експортер v11 не записував NORMAL, а жіночі моделі (girl/woman/women), '
                  'а також інші персонажі мали односторонні матеріали.\n'
                  'v12 додає нормалі до моделей персонажів і вмикає doubleSided '
                  'тільки для матеріалів розпізнаних моделей персонажів. '
                  'Оригінальні текстури, UV, трикутники та розташування об’єктів не змінюються.\n\n'
                  'Це тест графічної гіпотези, а не гарантоване відновлення облич; '
                  'не відновлює відсутні полігони, шкіру, анімації чи геймплей.\n'
                  'Після GitHub Actions порівняйте персонажів на рівнях 4, 8, 15 і 18.\n',encoding='utf8')
              (root/'v12_normals_face_report.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf8')
              return result
          
          if __name__=='__main__':
              root=Path(sys.argv[1] if len(sys.argv)>1 else '.')
              report=patch_project(root)
              print('PATCHED:',len(report),'scenes;',sum(v['normals_added_to_primitives'] for v in report.values()),'primitives;',sum(v['humanoid_double_sided_materials'] for v in report.values()),'character materials')
          PYTHON
          python3 /tmp/ravensword_v12_patch_glb.py .
          python3 validate_project.py
          python3 validate_assets.py
          python3 validate_spawn_hints.py
          python3 test_verify_android_device_target.py
          cat v12_normals_face_report.json
      - name: Fix cutout textures and masked materials (v13)
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/ravensword_v13_alpha_fix.py <<'PYTHON'
          #!/usr/bin/env python3
          """Repair wrongly opaque materials referencing cutout PNG textures in the v11/v12
          Ravensword Godot reconstruction. This is a visual diagnostic, not game logic.

          Usage: python3 ravensword_v13_alpha_fix.py /path/to/extracted/project
          Requires Pillow; if installed in CI, no other third-party dependencies.
          """
          from __future__ import annotations

          import hashlib
          import io
          import json
          import struct
          import sys
          from pathlib import Path
          from PIL import Image

          MAGIC = b"glTF"
          GLB_HEADER = struct.Struct("<4sII")
          CHUNK_HEADER = struct.Struct("<I4s")
          ALPHA_THRESHOLD = 128
          MIN_CUTOUT_RATIO = 0.01  # one percent actually transparent pixels


          def unpack(blob: bytes):
              if len(blob) < 28:
                  raise ValueError("GLB too small")
              magic, version, declared = GLB_HEADER.unpack_from(blob, 0)
              if magic != MAGIC or version != 2 or declared != len(blob):
                  raise ValueError("Invalid GLB header")
              json_size, json_kind = CHUNK_HEADER.unpack_from(blob, 12)
              if json_kind != b"JSON":
                  raise ValueError("GLB is missing first JSON chunk")
              bin_header_offset = 20 + json_size
              bin_size, bin_kind = CHUNK_HEADER.unpack_from(blob, bin_header_offset)
              if bin_kind != b"BIN\0" or bin_header_offset + 8 + bin_size != len(blob):
                  raise ValueError("GLB BIN size mismatch")
              j = json.loads(blob[20:20+json_size])
              return j, blob[bin_header_offset+8:]


          def pack(j: dict, binary: bytes):
              json_bytes = json.dumps(j, separators=(",", ":"), ensure_ascii=False).encode("utf8")
              json_bytes += b" " * ((-len(json_bytes)) % 4)
              if len(binary) % 4:
                  raise ValueError("BIN payload not 4-byte aligned")
              result = (GLB_HEADER.pack(MAGIC, 2, 12 + 8 + len(json_bytes) + 8 + len(binary))
                        + CHUNK_HEADER.pack(len(json_bytes), b"JSON") + json_bytes
                        + CHUNK_HEADER.pack(len(binary), b"BIN\0") + binary)
              return result


          def texture_alpha_info(j: dict, bin_chunk: bytes, material: dict, cache: dict):
              texref = material.get("pbrMetallicRoughness", {}).get("baseColorTexture")
              if not texref:
                  return None
              texture = j["textures"][texref["index"]]
              image_index = texture["source"]
              if image_index in cache:
                  return image_index, cache[image_index]
              image = j["images"][image_index]
              if "bufferView" not in image:
                  return None  # external image; do not silently modify
              view = j["bufferViews"][image["bufferView"]]
              start = view.get("byteOffset", 0)
              end = start + view["byteLength"]
              if start < 0 or end > len(bin_chunk):
                  raise ValueError("Image bufferView extends outside BIN chunk")
              with Image.open(io.BytesIO(bin_chunk[start:end])) as img:
                  rgba = img.convert("RGBA")
                  alpha = rgba.getchannel("A")
                  histogram = alpha.histogram()
                  ratio = sum(histogram[:ALPHA_THRESHOLD]) / (rgba.width * rgba.height)
              cache[image_index] = ratio
              return image_index, ratio


          def patch_one(blob: bytes):
              j, binary = unpack(blob)
              before_triangles = sum(j["accessors"][prim["indices"]]["count"] // 3
                                     for mesh in j.get("meshes", []) for prim in mesh.get("primitives", [])
                                     if "indices" in prim and prim.get("mode", 4) == 4)
              images_cache = {}
              report = []
              for imat, material in enumerate(j.get("materials", [])):
                  info = texture_alpha_info(j, binary, material, images_cache)
                  if info is None:
                      continue
                  image_index, ratio = info
                  if ratio < MIN_CUTOUT_RATIO:
                      continue
                  old_mode = material.get("alphaMode", "OPAQUE")
                  if old_mode not in ("OPAQUE", "MASK"):
                      continue  # Preserve intentional blended materials.
                  material["alphaMode"] = "MASK"
                  material["alphaCutoff"] = 0.5
                  material["doubleSided"] = True  # helps cutout sprites / vegetation
                  linked_meshes = [m.get("name", "") for m in j.get("meshes", [])
                                   for p in m.get("primitives", []) if p.get("material") == imat]
                  report.append({"material": imat, "image": image_index,
                                 "transparent_fraction": round(ratio, 4),
                                 "affected_mesh_count": len(linked_meshes),
                                 "examples": linked_meshes[:3], "previous_alpha_mode": old_mode})
              out = pack(j, binary)
              j2, bin2 = unpack(out)
              after_triangles = sum(j2["accessors"][prim["indices"]]["count"] // 3
                                    for mesh in j2.get("meshes", []) for prim in mesh.get("primitives", [])
                                    if "indices" in prim and prim.get("mode", 4) == 4)
              if before_triangles != after_triangles or binary != bin2:
                  raise AssertionError("The patch must not touch any mesh/image binary data or triangle counts")
              assert all(m["alphaMode"] == "MASK" and m["doubleSided"] for m in
                         (j2["materials"][row["material"]] for row in report))
              return out, report, before_triangles


          def patch_project(root: Path):
              catalog_path = root / "level_catalog.json"
              hints_path = root / "spawn_hints.json"
              catalog = json.loads(catalog_path.read_text(encoding="utf8"))
              hints = json.loads(hints_path.read_text(encoding="utf8"))
              results = {}
              for stage in catalog["stages"]:
                  level = stage["level"]
                  path = root / "assets" / f"{level}_geometry_preview.glb"
                  previous = path.read_bytes()
                  patched, changes, triangles = patch_one(previous)
                  if triangles != stage["triangles"]:
                      raise ValueError(f"Unexpected triangle count in {level}: {triangles}")
                  path.write_bytes(patched)
                  digest = hashlib.sha256(patched).hexdigest()
                  stage["sha256"] = digest
                  stage["bytes"] = len(patched)
                  hints["levels"][level]["source_sha256"] = digest
                  results[level] = {"previous_bytes": len(previous), "updated_bytes": len(patched),
                                    "triangles_unchanged": triangles,
                                    "alpha_cutout_materials": len(changes), "changes": changes}
                  print(level, "MASK materials:", len(changes), "triangles:", triangles)
              catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2), encoding="utf8")
              hints_path.write_text(json.dumps(hints, ensure_ascii=False, indent=2), encoding="utf8")
              for name in ("export_presets.cfg", "verify_android_device_target.py", "test_verify_android_device_target.py"):
                  path = root / name
                  if not path.is_file():
                      continue
                  txt = path.read_text(encoding="utf8")
                  txt = txt.replace("org.local.ravenswordwalkprototype.v12", "org.local.ravenswordwalkprototype.v13")
                  txt = txt.replace("Ravensword ARM64 Test v12", "Ravensword ARM64 Test v13")
                  if name == "export_presets.cfg":
                      txt = txt.replace("version/code=5", "version/code=6")
                  path.write_text(txt, encoding="utf8")
              (root / "v13_alpha_cutout_report.json").write_text(
                  json.dumps(results, ensure_ascii=False, indent=2), encoding="utf8")
              (root / "V13_GRAPHICS_TEST_UA.md").write_text(
                  "# Ravensword v13: тест прозорих текстур\n\n"
                  "Перевірено справжній альфа-канал вбудованих PNG. "
                  "Якщо >1% пікселів мають альфу <128, матеріал отримує "
                  "`alphaMode: MASK`, `alphaCutoff: 0.5`, `doubleSided: true`. "
                  "Геометрія, UV, зображення та точки появи не змінюються.\n\n"
                  "Це діагностична корекція для білих прямокутників, дерев, стрілок "
                  "і частини облич, а не гарантія повного відновлення графіки. "
                  "Порівняйте рівень 14, рівень 13 і героїню на рівні 8.\n",
                  encoding="utf8")
              return results


          if __name__ == "__main__":
              folder = Path(sys.argv[1] if len(sys.argv) > 1 else ".")
              rep = patch_project(folder)
              print("DONE", len(rep), "scenes,",
                    sum(x["alpha_cutout_materials"] for x in rep.values()), "material adjustments")
          PYTHON
          python3 /tmp/ravensword_v13_alpha_fix.py .
          python3 validate_project.py
          python3 validate_assets.py
          python3 validate_spawn_hints.py
          python3 validate_walkable_spawn.py
          python3 test_verify_android_device_target.py
          mkdir -p build
          cp v12_normals_face_report.json v13_alpha_cutout_report.json build/
          python3 - <<'PYTHON'
          import json
          with open('v13_alpha_cutout_report.json', encoding='utf8') as f: d=json.load(f)
          assert len(d)==21
          assert d['level14']['alpha_cutout_materials'] >= 7
          print('MASK assignments:',sum(row['alpha_cutout_materials'] for row in d.values()))
          print('Level14 affected materials:', d['level14']['alpha_cutout_materials'])
          PYTHON
      - name: Apply v14 gameplay test, wall-aware camera, and normals for all meshes
        shell: bash
        run: |
          set -Eeuo pipefail
          # Embedded small source overlay: no need to re-upload the four v11 project chunks.
          base64 -d > /tmp/ravensword-v14-source-overlay.zip <<'RWV14'
