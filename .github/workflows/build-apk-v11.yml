name: Ravensword APK v11 - corrected materials
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify uploaded Ravensword project
        shell: bash
        run: |
          set -Eeuo pipefail
          for n in 01 02 03 04; do test -s "ravensword_v11_project.part${n}"; done
          cat ravensword_v11_project.part01 ravensword_v11_project.part02 ravensword_v11_project.part03 ravensword_v11_project.part04 > "$RUNNER_TEMP/ravensword-project.zip"
          [[ "$(sha256sum "$RUNNER_TEMP/ravensword-project.zip" | cut -d ' ' -f1)" == "4e324756cbd95c5b673720b9133cb7f417e08e07dd0dd5831c3eb7522954339a" ]] || { echo 'Project chunks are incomplete/modified'; exit 1; }
          unzip -t "$RUNNER_TEMP/ravensword-project.zip" >/dev/null
          unzip -oq "$RUNNER_TEMP/ravensword-project.zip" -d .
          test -s project.godot
          test -s export_presets.cfg
          test -f assets/level21_geometry_preview.glb
      - name: Quick project check before installing toolchains
        run: |
          python3 validate_project.py
          python3 test_verify_android_apk.py
          python3 test_verify_android_page_size.py
          python3 test_verify_android_device_target.py
          python3 test_runtime_diagnostics_static.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # GitHub-hosted ubuntu-24.04 runners already include the Android SDK.
      # Avoid android-actions/setup-android@v3: sdkmanager inside that action
      # fails on some runner images before Godot can be installed.
      - name: Verify preinstalled Android SDK on GitHub runner
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK" ]]; then
            echo '::error::ANDROID_SDK_ROOT and ANDROID_HOME are not set'
            exit 1
          fi
          echo "Android SDK: $SDK"
          for file in \
              platform-tools/adb \
              build-tools/35.0.1/aapt \
              build-tools/35.0.1/zipalign \
              build-tools/35.0.1/apksigner \
              platforms/android-35/android.jar; do
            if [[ ! -s "$SDK/$file" ]]; then
              echo "::error::Missing required Android SDK component: $SDK/$file"
              exit 1
            fi
          done
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo 'Preinstalled Android SDK components verified.'
      - name: Install Godot 4.6 and matching templates
        run: |
          set -euo pipefail
          base='https://github.com/godotengine/godot-builds/releases/download/4.6-stable'
          curl -fL --retry 3 -o /tmp/godot.zip "$base/Godot_v4.6-stable_linux.x86_64.zip"
          unzip -t /tmp/godot.zip >/dev/null
          mkdir -p /tmp/godot
          unzip -jo /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v4.6-stable_linux.x86_64" >> "$GITHUB_ENV"
          curl -fL --retry 3 -o /tmp/templates.tpz "$base/Godot_v4.6-stable_export_templates.tpz"
          unzip -t /tmp/templates.tpz >/dev/null
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          unzip -jo /tmp/templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/android_source.zip' -d "$HOME/.local/share/godot/export_templates/4.6.stable"
          test -s "$HOME/.local/share/godot/export_templates/4.6.stable/android_debug.apk"
          echo "4.6.stable" > "$HOME/.local/share/godot/export_templates/4.6.stable/version.txt"
      - name: Create temporary Android debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"
      - name: Validate original recovered GLB assets
        run: |
          python3 -m pip install pillow numpy trimesh
          python3 validate_project.py
          python3 test_verify_android_apk.py
          python3 test_verify_android_page_size.py
          python3 test_verify_android_device_target.py
          python3 validate_assets.py
          python3 validate_spawn_hints.py
          python3 validate_walkable_spawn.py
      - name: Initialize Godot and configure Android SDK paths
        run: |
          "$GODOT_BIN" --headless --path . --editor --quit
          python3 configure_godot_android.py
      - name: Import GLB and export APK
        run: bash ./export_android.sh
      - name: Check Godot successfully loaded all reconstructed scenes
        run: |
          python3 verify_godot_smoke_report.py build/godot_scene_smoke.json
      - name: Check main scene, controls and experimental walker in Godot
        run: python3 verify_godot_app_runtime.py build/godot_app_runtime_smoke.json
      - name: Report APK checks for ARM64 and Android 16 (16 KiB)
        run: |
          cat build/apk_16k_report.json
          cat build/android_target_report.json
          cat build/zipalign_16k.log
          cat build/apksigner.log
      # The APK is deliberately NOT published when any build or validation step failed.
      - name: Publish VERIFIED APK and logs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ravensword-arm64-prototype-v11
          path: |
            build/ravensword-prototype-arm64-debug.apk
            build/*.log
            build/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Collect failure diagnostics (NO APK)
        if: failure()
        shell: bash
        run: |
          mkdir -p build
          {
            echo 'Ravensword Android test build did not complete all checks.'
            echo 'No APK is published by the failure-diagnostics step.'
            echo 'Open this GitHub Actions run and inspect the first failed step.'
            echo 'If requesting help, share failed-step text or the logs artifact.'
          } > build/BUILD_FAILED_README.txt
      - name: Publish failure logs (NO APK)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ravensword-build-failure-logs
          path: |
            build/*.log
            build/*.json
            build/BUILD_FAILED_README.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Write concise run summary
        if: always()
        shell: bash
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            {
              echo '## Ravensword: test APK passed workflow checks'
              echo 'Download **ravensword-arm64-prototype-v11** under Artifacts.'
              echo 'This APK is only a 21-scene prototype, not the complete game.'
              echo 'Android device installation and gameplay remain untested.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## Ravensword: build or validation failed'
              echo 'An APK was not published as a verified result.'
              echo 'Open the first failed step; if available download **ravensword-build-failure-logs**.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
