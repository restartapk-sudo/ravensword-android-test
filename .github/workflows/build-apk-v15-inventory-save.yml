    - name: Initialize Godot and configure Android SDK paths
      run: '"$GODOT_BIN" --headless --path . --editor --quit

        python3 configure_godot_android.py

        '
    - name: Test inventory and versioned save inside Godot
      shell: bash
      run: '"$GODOT_BIN" --headless --path . --script ci_inventory_save_test.gd'
    - name: Import GLB and export APK
      run: bash ./export_android.sh
    - name: Check Godot successfully loaded all reconstructed scenes
      run: 'python3 verify_godot_smoke_report.py build/godot_scene_smoke.json

        '
    - name: Check main scene, controls and experimental walker in Godot
      run: python3 verify_godot_app_runtime.py build/godot_app_runtime_smoke.json
    - name: Report APK checks for ARM64 and Android 16 (16 KiB)
      run: 'cat build/apk_16k_report.json

        cat build/android_target_report.json

        cat build/zipalign_16k.log

        cat build/apksigner.log

        '
    - name: Publish VERIFIED APK and logs
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ravensword-arm64-prototype-v15
        path: 'build/ravensword-prototype-arm64-debug.apk

          build/*.log

          build/*.json

          '
        if-no-files-found: error
        retention-days: 7
    - name: Collect failure diagnostics (NO APK)
      if: failure()
      shell: bash
      run: "mkdir -p build\n{\n  echo 'Ravensword Android test build did not complete all checks.'\n  echo 'No APK is published\
        \ by the failure-diagnostics step.'\n  echo 'Open this GitHub Actions run and inspect the first failed step.'\n  echo\
        \ 'If requesting help, share failed-step text or the logs artifact.'\n} > build/BUILD_FAILED_README.txt\n"
    - name: Publish failure logs (NO APK)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ravensword-build-failure-logs
        path: 'build/*.log

          build/*.json

          build/BUILD_FAILED_README.txt

          '
        if-no-files-found: warn
        retention-days: 7
    - name: Write concise run summary
      if: always()
      shell: bash
      run: "if [[ \"${{ job.status }}\" == \"success\" ]]; then\n  {\n    echo '## Ravensword: test APK passed workflow checks'\n\
        \    echo 'Download **ravensword-arm64-prototype-v15** under Artifacts.'\n    echo 'This is a TEST APK using v11 GLB\
        \ graphics baseline, v14 experimental gameplay, and v15 inventory/save modules. Not original Ravensword logic.'\n\
        \    echo 'Android device installation and gameplay remain untested.'\n  } >> \"$GITHUB_STEP_SUMMARY\"\nelse\n  {\n\
        \    echo '## Ravensword: build or validation failed'\n    echo 'An APK was not published as a verified result.'\n\
        \    echo 'Open the first failed step; if available download **ravensword-build-failure-logs**.'\n  } >> \"$GITHUB_STEP_SUMMARY\"\
        \nfi\n"
'on':
  workflow_dispatch: null
  push:
    branches:
    - main
    paths:
    - .github/workflows/build-apk-v15-inventory-save.yml
