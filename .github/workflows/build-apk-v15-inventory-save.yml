name: Ravensword APK v15 - inventory save contract test
permissions:
  contents: read
jobs:
  export-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - name: Reassemble and verify uploaded Ravensword project
      shell: bash
      run: 'set -Eeuo pipefail

        for n in 01 02 03 04; do test -s "ravensword_v11_project.part${n}"; done

        cat ravensword_v11_project.part01 ravensword_v11_project.part02 ravensword_v11_project.part03 ravensword_v11_project.part04
        > "$RUNNER_TEMP/ravensword-project.zip"

        [[ "$(sha256sum "$RUNNER_TEMP/ravensword-project.zip" | cut -d '' '' -f1)" == "4e324756cbd95c5b673720b9133cb7f417e08e07dd0dd5831c3eb7522954339a"
        ]] || { echo ''Project chunks are incomplete/modified''; exit 1; }

        unzip -t "$RUNNER_TEMP/ravensword-project.zip" >/dev/null

        unzip -oq "$RUNNER_TEMP/ravensword-project.zip" -d .

        test -s project.godot

        test -s export_presets.cfg

        test -f assets/level21_geometry_preview.glb

        '
    - name: Quick project check before installing toolchains
      run: 'python3 validate_project.py

        python3 test_verify_android_apk.py

        python3 test_verify_android_page_size.py

        python3 test_verify_android_device_target.py

        python3 test_runtime_diagnostics_static.py

        '
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify preinstalled Android SDK on GitHub runner
      shell: bash
      run: "set -Eeuo pipefail\nSDK=\"${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}\"\nif [[ -z \"$SDK\" ]]; then\n  echo '::error::ANDROID_SDK_ROOT\
        \ and ANDROID_HOME are not set'\n  exit 1\nfi\necho \"Android SDK: $SDK\"\nfor file in \\\n    platform-tools/adb\
        \ \\\n    build-tools/35.0.1/aapt \\\n    build-tools/35.0.1/zipalign \\\n    build-tools/35.0.1/apksigner \\\n  \
        \  platforms/android-35/android.jar; do\n  if [[ ! -s \"$SDK/$file\" ]]; then\n    echo \"::error::Missing required\
        \ Android SDK component: $SDK/$file\"\n    exit 1\n  fi\ndone\necho \"ANDROID_SDK_ROOT=$SDK\" >> \"$GITHUB_ENV\"\n\
        echo 'Preinstalled Android SDK components verified.'\n"
    - name: Install Godot 4.6 and matching templates
      run: 'set -euo pipefail

        base=''https://github.com/godotengine/godot-builds/releases/download/4.6-stable''

        curl -fL --retry 3 -o /tmp/godot.zip "$base/Godot_v4.6-stable_linux.x86_64.zip"

        unzip -t /tmp/godot.zip >/dev/null

        mkdir -p /tmp/godot

        unzip -jo /tmp/godot.zip -d /tmp/godot

        chmod +x /tmp/godot/Godot_v4.6-stable_linux.x86_64

        echo "GODOT_BIN=/tmp/godot/Godot_v4.6-stable_linux.x86_64" >> "$GITHUB_ENV"

        curl -fL --retry 3 -o /tmp/templates.tpz "$base/Godot_v4.6-stable_export_templates.tpz"

        unzip -t /tmp/templates.tpz >/dev/null

        mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"

        unzip -jo /tmp/templates.tpz ''templates/android_debug.apk'' ''templates/android_release.apk'' ''templates/android_source.zip''
        -d "$HOME/.local/share/godot/export_templates/4.6.stable"

        test -s "$HOME/.local/share/godot/export_templates/4.6.stable/android_debug.apk"

        echo "4.6.stable" > "$HOME/.local/share/godot/export_templates/4.6.stable/version.txt"

        '
    - name: Create temporary Android debug signing key
      run: 'mkdir -p "$HOME/.android"

        keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android
        -keyalg RSA -keysize 2048 -validity 10000 -dname ''CN=Android Debug,O=Android,C=US''

        echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"

        echo ''GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey'' >> "$GITHUB_ENV"

        echo ''GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android'' >> "$GITHUB_ENV"

        '
    - name: Validate original recovered GLB assets
      run: 'python3 -m pip install pillow numpy trimesh

        python3 validate_project.py

        python3 test_verify_android_apk.py

        python3 test_verify_android_page_size.py

        python3 test_verify_android_device_target.py

        python3 validate_assets.py

        python3 validate_spawn_hints.py

        python3 validate_walkable_spawn.py

        '
